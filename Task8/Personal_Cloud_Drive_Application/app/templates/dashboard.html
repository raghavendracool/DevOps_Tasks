{% extends "base.html" %}
{% block content %}
<header class="topbar">
  <div>
    <h1>My Cloud Drive</h1>
    <p>Signed in as {{ username }}</p>
  </div>
  <a class="secondary" href="{{ url_for('logout') }}">Logout</a>
</header>

<section class="card">
  <h2>Upload File</h2>
  <form class="upload-form" method="post" action="{{ url_for('upload') }}" enctype="multipart/form-data">
    <input type="file" name="file" required>
    <button type="submit">Upload</button>
  </form>
</section>

<section class="card">
  <h2>Your Files</h2>
  {% if files %}
    <div class="file-list">
      {% for file in files %}
        <article class="file-row">
          <div>
            <strong>{{ file.name }}</strong>
            <small>{{ file.size }} bytes</small>
          </div>
          <div class="actions">
            <a href="{{ url_for('download', filename=file.name) }}">Download</a>
            <form method="post" action="{{ url_for('delete', filename=file.name) }}">
              <button class="danger" type="submit">Delete</button>
            </form>
          </div>
        </article>
      {% endfor %}
    </div>
  {% else %}
    <p>No files uploaded yet.</p>
  {% endif %}
</section>
{% endblock %}
