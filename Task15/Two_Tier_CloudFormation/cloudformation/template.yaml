AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Task 15 - Two-tier web architecture with an internet-facing Application
  Load Balancer, private Ubuntu web server, public Bastion Host, NAT Gateway,
  IAM role, NGINX User Data, and complete VPC networking.

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network Configuration
        Parameters:
          - VpcCidr
          - PublicSubnetACidr
          - PublicSubnetBCidr
          - PrivateSubnetCidr
      - Label:
          default: EC2 Configuration
        Parameters:
          - UbuntuAmiId
          - KeyName
          - BastionInstanceType
          - WebInstanceType
          - AdminCidr
    ParameterLabels:
      AdminCidr:
        default: Administrator public CIDR
      KeyName:
        default: Existing EC2 key pair

Parameters:
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
    AllowedPattern: "(^$)|(^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$)"
    Description: CIDR block for the VPC.

  PublicSubnetACidr:
    Type: String
    Default: 10.0.1.0/24
    Description: CIDR block for public subnet A.

  PublicSubnetBCidr:
    Type: String
    Default: 10.0.2.0/24
    Description: CIDR block for public subnet B.

  PrivateSubnetCidr:
    Type: String
    Default: 10.0.11.0/24
    Description: CIDR block for the private web subnet.

  UbuntuAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/canonical/ubuntu/server/24.04/stable/current/amd64/hvm/ebs-gp3/ami-id
    Description: Latest Canonical Ubuntu Server 24.04 LTS AMI through SSM.

  KeyName:
    Type: AWS::EC2::KeyPair::KeyName
    Description: Existing EC2 key pair used for Bastion and Web Server.

  AdminCidr:
    Type: String
    AllowedPattern: "^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[1-2][0-9]|3[0-2])$"
    ConstraintDescription: Must be an IPv4 CIDR such as 203.0.113.10/32.
    Description: Public CIDR allowed to SSH to the Bastion Host.

  BastionInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
      - t4g.micro
    Description: EC2 instance type for the Bastion Host.

  WebInstanceType:
    Type: String
    Default: t3.micro
    AllowedValues:
      - t3.micro
      - t3.small
    Description: EC2 instance type for the private Web Server.

Resources:
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      InstanceTenancy: default
      Tags:
        - Key: Name
          Value: task15-vpc
        - Key: Project
          Value: DevOps-Task-15

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: task15-igw

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetACidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: task15-public-a

  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: !Ref PublicSubnetBCidr
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: task15-public-b

  PrivateSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: !Ref PrivateSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: task15-private-web

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: task15-public-rt

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnetARouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetA
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetBRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetB
      RouteTableId: !Ref PublicRouteTable

  NatElasticIp:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: task15-nat-eip

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicDefaultRoute
    Properties:
      AllocationId: !GetAtt NatElasticIp.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags:
        - Key: Name
          Value: task15-nat-gateway

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: task15-private-rt

  PrivateDefaultRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnetRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet
      RouteTableId: !Ref PrivateRouteTable

  LoadBalancerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow public HTTP access to the Application Load Balancer.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: HTTP from the internet
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      SecurityGroupEgress:
        - Description: HTTP to the private Web Server
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          DestinationSecurityGroupId: !Ref WebServerSecurityGroup
      Tags:
        - Key: Name
          Value: task15-alb-sg

  BastionSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow SSH to the Bastion Host only from the administrator CIDR.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: SSH from administrator
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: !Ref AdminCidr
      SecurityGroupEgress:
        - Description: SSH to the private Web Server
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          DestinationSecurityGroupId: !Ref WebServerSecurityGroup
        - Description: HTTPS outbound for operating-system services
          IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: task15-bastion-sg

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow HTTP from ALB and SSH from Bastion.
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - Description: HTTP from the ALB
          IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourceSecurityGroupId: !Ref LoadBalancerSecurityGroup
        - Description: SSH from the Bastion Host
          IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          SourceSecurityGroupId: !Ref BastionSecurityGroup
      SecurityGroupEgress:
        - Description: Outbound access through NAT Gateway
          IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: task15-web-sg

  WebServerRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub task15-web-role-${AWS::Region}
      Description: IAM role for the Task 15 private Web Server.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Tags:
        - Key: Project
          Value: DevOps-Task-15

  WebServerInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub task15-web-profile-${AWS::Region}
      Roles:
        - !Ref WebServerRole

  BastionHost:
    Type: AWS::EC2::Instance
    DependsOn: PublicDefaultRoute
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref BastionInstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PublicSubnetA
      SecurityGroupIds:
        - !Ref BastionSecurityGroup
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 8
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      Tags:
        - Key: Name
          Value: task15-bastion-host
        - Key: Project
          Value: DevOps-Task-15

  WebServer:
    Type: AWS::EC2::Instance
    DependsOn:
      - PrivateDefaultRoute
      - WebServerInstanceProfile
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: PT15M
    Properties:
      ImageId: !Ref UbuntuAmiId
      InstanceType: !Ref WebInstanceType
      KeyName: !Ref KeyName
      SubnetId: !Ref PrivateSubnet
      SecurityGroupIds:
        - !Ref WebServerSecurityGroup
      IamInstanceProfile: !Ref WebServerInstanceProfile
      MetadataOptions:
        HttpEndpoint: enabled
        HttpTokens: required
        HttpPutResponseHopLimit: 1
      BlockDeviceMappings:
        - DeviceName: /dev/sda1
          Ebs:
            VolumeSize: 10
            VolumeType: gp3
            Encrypted: true
            DeleteOnTermination: true
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive

          apt-get update -y
          apt-get install -y nginx curl python3-pip

          TOKEN=$(curl -sS -X PUT \
            -H "X-aws-ec2-metadata-token-ttl-seconds: 21600" \
            http://169.254.169.254/latest/api/token)

          metadata() {
            curl -sS \
              -H "X-aws-ec2-metadata-token: ${!TOKEN}" \
              "http://169.254.169.254/latest/meta-data/$1"
          }

          INSTANCE_ID=$(metadata instance-id)
          PRIVATE_IP=$(metadata local-ipv4)
          AZ=$(metadata placement/availability-zone)
          HOSTNAME=$(hostname)

          cat > /var/www/html/index.html <<EOF
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Task 15 Two-Tier Web Application</title>
            <style>
              body {
                margin: 0;
                font-family: Arial, sans-serif;
                background: #eef4fb;
                color: #17324d;
              }
              main {
                max-width: 900px;
                margin: 60px auto;
                padding: 24px;
              }
              section {
                background: white;
                padding: 36px;
                border-radius: 18px;
                box-shadow: 0 14px 35px rgba(0,0,0,.10);
              }
              h1 { color: #1769aa; }
              .status {
                margin-top: 24px;
                padding: 18px;
                background: #e7f5ff;
                border-left: 5px solid #1769aa;
              }
              code { overflow-wrap: anywhere; }
            </style>
          </head>
          <body>
            <main>
              <section>
                <p>AWS DEVOPS PROJECT 15</p>
                <h1>Two-Tier Web Application</h1>
                <p>Deployed automatically using AWS CloudFormation and Ubuntu User Data.</p>
                <div class="status">
                  <p><strong>Instance ID:</strong> <code>$INSTANCE_ID</code></p>
                  <p><strong>Availability Zone:</strong> <code>$AZ</code></p>
                  <p><strong>Private IP:</strong> <code>$PRIVATE_IP</code></p>
                  <p><strong>Hostname:</strong> <code>$HOSTNAME</code></p>
                </div>
              </section>
            </main>
          </body>
          </html>
          EOF

          chown -R www-data:www-data /var/www/html
          systemctl enable nginx
          nginx -t
          systemctl restart nginx

          /usr/local/bin/cfn-signal \
            --exit-code $? \
            --stack ${AWS::StackName} \
            --resource WebServer \
            --region ${AWS::Region}
      Tags:
        - Key: Name
          Value: task15-private-web-server
        - Key: Project
          Value: DevOps-Task-15

  WebTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    DependsOn: WebServer
    Properties:
      Name: !Sub task15-web-tg-${AWS::Region}
      TargetType: instance
      Protocol: HTTP
      Port: 80
      VpcId: !Ref VPC
      HealthCheckEnabled: true
      HealthCheckProtocol: HTTP
      HealthCheckPort: traffic-port
      HealthCheckPath: /
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 2
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      Matcher:
        HttpCode: "200"
      Targets:
        - Id: !Ref WebServer
          Port: 80
      Tags:
        - Key: Name
          Value: task15-web-target-group

  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    DependsOn: VPCGatewayAttachment
    Properties:
      Name: task15-web-alb
      Scheme: internet-facing
      Type: application
      IpAddressType: ipv4
      SecurityGroups:
        - !Ref LoadBalancerSecurityGroup
      Subnets:
        - !Ref PublicSubnetA
        - !Ref PublicSubnetB
      LoadBalancerAttributes:
        - Key: deletion_protection.enabled
          Value: "false"
        - Key: routing.http.drop_invalid_header_fields.enabled
          Value: "true"
      Tags:
        - Key: Name
          Value: task15-web-alb

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    DependsOn:
      - ApplicationLoadBalancer
      - WebTargetGroup
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref WebTargetGroup

Outputs:
  ApplicationURL:
    Description: Public URL of the application.
    Value: !Sub http://${ApplicationLoadBalancer.DNSName}

  LoadBalancerDNSName:
    Description: DNS name of the Application Load Balancer.
    Value: !GetAtt ApplicationLoadBalancer.DNSName

  BastionPublicIP:
    Description: Public IP address of the Bastion Host.
    Value: !GetAtt BastionHost.PublicIp

  BastionPrivateIP:
    Description: Private IP address of the Bastion Host.
    Value: !GetAtt BastionHost.PrivateIp

  WebServerPrivateIP:
    Description: Private IP address of the Web Server.
    Value: !GetAtt WebServer.PrivateIp

  VPCId:
    Description: VPC ID.
    Value: !Ref VPC

  PublicSubnetAId:
    Description: Public subnet A ID.
    Value: !Ref PublicSubnetA

  PublicSubnetBId:
    Description: Public subnet B ID.
    Value: !Ref PublicSubnetB

  PrivateSubnetId:
    Description: Private Web Server subnet ID.
    Value: !Ref PrivateSubnet

  TargetGroupArn:
    Description: ARN of the Web Server Target Group.
    Value: !Ref WebTargetGroup
